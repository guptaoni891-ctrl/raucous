      <stop stop-color="#10162b"/><stop offset="1" stop-color="#080b14"/>
    </linearGradient>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0 0l12 6-12 6z" fill="#8ea0ff"/>
    </marker>
  </defs>
  <rect width="1100" height="420" rx="24" fill="url(#bg)"/>
  <g font-family="Inter,Segoe UI,sans-serif">
    <g fill="#17213d" stroke="#6478d8" stroke-width="2">
